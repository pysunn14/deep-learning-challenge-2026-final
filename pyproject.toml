[project]
name = "dlc2026-final-inference"
version = "1.0.0"
description = "Reproducible Base N16 MLX inference for DLC 2026"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm==0.31.3",
]

[project.scripts]
dlc-final = "dlc_final.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlc_final"]
